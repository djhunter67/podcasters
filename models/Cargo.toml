[package]
name = "models"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = { level = "deny", priority = 1 }
wildcard_imports = "deny"
must_use_candidate = "warn"
enum_glob_use = "deny"
nursery = { level = "deny", priority = 1 }
unwrap_used = "deny"

[profile.release]
overflow-checks = false
lto = "fat"  # LTO can produce better optimized code; 'false', 'fat', 'thin', or 'off'
codegen-units = 16  # Split crate into units to increase parallelism during compilation, may produce slower code; '1 - 256'
panic = "abort"
incremental = false  # Store cache data to disk in the 'target' dir for quicker recompilation
opt-level = 3
strip = "symbols"  # equivalent to strip = true
rpath = false  
debug-assertions = false
debug = false

[profile.dev]
overflow-checks = true
opt-level = 0
strip = "none"
codegen-units = 256
lto = "off"
panic = "unwind"
incremental = true
debug = "line-tables-only"
debug-assertions = false

[profile.dev.build-override]
opt-level = 0
codegen-units = 256
debug = false


[dependencies]
anyhow = "1.0.104"
config = "0.15.25"
mongodb = "3.8.0"
redis = { version = "1.6.0", features = ["tokio-comp", "aio", "connection-manager"] }
serde = "1.0.229"
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
r2d2 = "0.8.10"
rstest = { version = "0.26.1", features = ["async-timeout"] }
tokio = "1.53.1"


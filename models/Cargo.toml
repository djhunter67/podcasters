[package]
name = "models"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
config = "0.15.25"
mongodb = "3.8.0"
redis = { git = "https://github.com/redis-rs/redis-rs.git", branch = "2.0.x" , features = ["tokio-comp", "aio", "connection-manager"] }
serde = "1.0.229"
serde_json = "1.0.151"
shared = { version = "0.1.0", path = "../shared" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
r2d2 = "0.8.10"
rstest = { version = "0.26.1", features = ["async-timeout"] }
tokio = "1.53.1"


[package]
name = "podcasting"
version = "0.1.0"
edition = "2024"

[lib]
name = "podcasting"
path = "src/lib.rs"

[[bin]]
name = "podcasting"
path = "src/main.rs"

[[example]]
name = "inspect_feed"
path = "examples/inspect_feed.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
mongodb = { version = "3.9.0", default-features = false }
rayon = "1.12.0"
redis = "1.7.0"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde-xml-rs = "0.8.2"
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["full", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }


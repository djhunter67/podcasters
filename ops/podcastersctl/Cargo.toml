[package]
name = "podcastersctl"
version = "0.1.0"
edition = "2024"

[lib]
name = "podcastersctl"
path = "src/lib.rs"

[[bin]]
name = "podcastersctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "unstable-markdown"] }
mongodb = "3.8.1"
redis = { version = "1.6.0", features = ["connection-manager", "aio", "tokio-comp"] }
serde_json = "1.0.151"
shared = { version = "0.1.0", path = "../../shared" }
tokio = { version = "1.53.1", default-features = false, features = ["full"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = { version = "2.2.2", features = ["color", "color-auto"] }
predicates = "3.1.4"
rstest = "0.26.1"

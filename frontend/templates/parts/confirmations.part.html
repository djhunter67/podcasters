<div id="confirmation">
    <div id="confirmation__header">
      <h2 id="confirmation__header__message">{{ header_message }}</h2>
    </div>
    <div id="confirmation__body">
      <p id="confirmation__body__text">
        {{ body_message }}
      </p>
      <button
	id="main__confirmation__submit"
	hx-get="/"
	hx-target="#template_pages"
	hx-swap="outerHTML"
	hx-trigger="click"
	hx-target-error="#error_template">
	CONFIRM
      </button>
    </div>
  </div>

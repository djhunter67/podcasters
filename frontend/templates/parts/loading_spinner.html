    <style>


      
      #loading {
	  position: absolute;
	  z-index: 2;
	  width: 8rem;
	  background-color: #222222;
	  border: 1px solid yellow;
	  border-radius: 2rem;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  left: calc(50% - 8rem / 2);
	  top: 0;
	  
	  h4 {
	      color: yellow;
	  }
	  
	  
	  #loading__circle {
	      display: block;
	      margin: 7px auto;
	      width: 40px;
	      height: 40px;
	      border: 5px solid white;
	      border-radius: 50%;
	      border-top-color: blue;
	      animation: spin 1s ease infinite;
	  }
      }    
      @keyframes spin {
	  100% {
	      transform: rotate(360deg);
	  }
      }
    </style>
  
    <div id="loading" class="htmx-indicator">
      <div>
	<h4>LOADING</h4>
	<div id="loading__circle"></div>
      </div>
    </div>

<section id="main__info_cards">    
  <section id="input_and_image">
    <div id="upload_response"></div>
    <form
      hx-post="/v1/submit_text"
      hx-swap="outerHTML"
      hx-target="#main__info_cards"
      hx-trigger="click, keydown[ctrlKey && key=='Enter'] from:textarea"
      id="main__info_cards__journaler"
      >
      <input id="main__info_cards__journaler__title" type="text" name="title" placeholder="Place title here" required>
      <textarea id="main__info_cards__journaler__body" name="body" placeholder="Enter your text here" rows="6" required></textarea>
      <input id="hidden_to_pass_the_author" hidden name="author" value="{{ content.get_email() }}">
      <button type="submit">Submit</button>
    </form>
    
    <input
      id="picture_upload"
      enctype="multipart/form-data"
      hx-encoding="multipart/form-data"
      hx-post="/v1/post_image"
      hx-target="#upload_response"
      hx-swap="innerHTML"
      type="file"
      name="post_image"
      accept="image/*"
      >
  </section>
</section>

<section id="main__info_cards">
  <section id="indiv_cards"> 
    <div class="indiv_cards__card">
      <div class="indiv_cards__card__header">
	<img src="/static/rand_images/1" alt="card image">
	<h2 id="get_title">{{ content.get_title() }}</h2>
	<h3 id="get_authore">Author: {{content.get_author()}}</h3>
      </div>
      <div class="indiv_cards__card__text" id="indiv_cards__card__0">
	<p id="get_body">
          {{ content.get_body() }}
	</p>
	<h3>
	  {{ content.get_date() }}
	</h3>
	<h4 hidden> {{ content.get_user_id() }}{{ content.get_post_id() }}</h4>
      </div>
    </div>
    
    <aside id="main__info_cards__confirmation">
      <button
	id="main__confirmation__submit"
	hx-get="/"
	hx-target="body"
	hx-swap="outerHTML"
	hx-trigger="click"
	hx-target-error="#error_template">
	CONFIRM
      </button>
      <button
	id="main__confirmation__edit"
	hx-post="/v1/editor_submission"
	hx-vals='{
		 "title": "{{content.get_title()}}",
		 "body": "{{content.get_body()}}",
		 "author": "{{content.get_author()}}",
		 "user_id": "{{ content.get_user_id() }}",
		 "_id": "{{content.get_post_id()}}"
		 }'
	hx-target="#main"
	hx-swap="innerHTML"
	type="button"
	>
	EDIT
      </button>
      <button
	id="main__confirmation__delete"
	hx-delete="/v1/delete_submission"
	hx-vals='{
		 "title": "{{content.get_title()}}",
		 "body": "{{content.get_body()}}",
		 "author": "{{content.get_author()}}",
		 "user_id": "{{ content.get_user_id() }}",
		 "_id": "{{content.get_post_id()}}"
		 }'
	hx-target="body"
	hx-swap="outerHTML"
	hx-confirm="Are you sure?"
	>
	DELETE
      </button>
    </aside>
  </section>  
</section>

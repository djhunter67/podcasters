<aside id="sidebar">
  <img src="/static/icon-192" alt="Sidebar logo">
  <div id="sidebar__top">
    <a
      hx-get="/"
      hx-target="body"
      hx-swap="outerHTML transition: true"   
      >HOME
    </a>
    <a
      hx-get="/discover"
      hx-target="#main"
      hx-swap="innerHTML transition:true"
      >DISCOVER
    </a>
    <a
      hx-get="/podcasts"
      hx-target="#main"
      hx-swap="innerHTML transition:true"
      >PODCASTS
    </a>
    <a
      hx-get="/episodes"
      hx-target="#main"
      hx-swap="innerHTML transition:true"
      >EPISODES
    </a>
  </div>
  <div id="sidebar__mid">
    <a
      hx-get="/queue"
      hx-target="#main"
      hx-swap="innerHTML transition:true"
      >QUEUE
    </a>
    <a
      hx-get="/history"
      hx-target="#main"
      hx-swap="innerHTML transition:true"
      >HISTORY
    </a>
  </div>
  <div id="sidebar__bottom">
  <a
    hx-get="/playlist"
    hx-target="#main"
    hx-swap="innerHTML transition:true"
    >PLAYLIST
  </a>
  <a
    hx-get="/profile"
    hx-target="#main"
    hx-swap="innerHTML transition:true"
    >PROFILE
  </a>  
</aside>

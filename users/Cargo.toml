[package]
name = "users"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "users"

[[bin]]
  path = "src/main.rs"
  name = "users"

[dependencies]
anyhow = "1.0.104"
mongodb = "3.9.1"
redis = { version = "1.7.1", features = ["connection-manager", "aio", "tokio-comp"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
shared = { version = "0.1.0", path = "../shared" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
rstest = "0.26.1"


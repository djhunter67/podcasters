[package]
name = "users"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "users"

[[bin]]
  path = "src/main.rs"
  name = "users"

[dependencies]
redis = "1.7.1"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
rstest = "0.26.1"


version: '3.8'

services:
  mongodb:
    image: mongodb-raspberrypi4-unofficial-r7.0.4
    container_name: mongodb-secure
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ~/mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: djhunter67
      MONGO_INITDB_ROOT_PASSWORD: secret_passers
    # Optional: Limit memory to prevent crashes on Pi 4
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:alpine
    container-name: redis-secure
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=secret_passers_redis
    command: redis-server --requirepass secret_passers_redis
    volumes:
      - ~/redis-data:/data
